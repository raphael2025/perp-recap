[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "perp-recap"
version = "0.1.0"
description = "Local-first Binance USD-M trade review: CSV fills on futures candles"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["streamlit>=1.50,<2", "plotly>=6,<7", "requests>=2.32,<3", "ccxt>=4.4,<5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools.packages.find]
include = ["perp_recap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = [".venv*", "data", "output"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
